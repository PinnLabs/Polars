name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest

  without-pydantic:
    name: check (without pydantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-default-groups --group test
      - name: Fail if pydantic is installed
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pydantic') is not None)"
      - run: uv run --no-sync pytest
